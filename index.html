<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CommsCord - Firewall Proof Chat</title>
    <!-- Standard secure corporate HTTPS link database bypasses Wi-Fi port blocks -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #313338; color: #dbdee1; height: 100vh; display: flex; overflow: hidden; }
        #server-sidebar { background-color: #1e1f22; width: 72px; display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; }
        .server-icon { background-color: #35363c; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #dbdee1; cursor: pointer; font-size: 18px; }
        #channels-sidebar { background-color: #2b2d31; width: 240px; display: flex; flex-direction: column; }
        .server-header { height: 48px; padding: 0 16px; display: flex; align-items: center; font-weight: bold; border-bottom: 1px solid #1f2023; color: #fff; font-size: 15px; }
        .channels-list { flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
        .channel-item { padding: 6px 8px; border-radius: 4px; display: flex; align-items: center; gap: 6px; cursor: pointer; color: #949ba4; font-size: 15px; font-weight: 500; }
        .channel-item:hover { background-color: #35373c; color: #deecf2; }
        .channel-item.active { background-color: #404249; color: #fff; }
        .channel-hash { color: #80848e; font-size: 18px; }
        #main-chat-area { flex: 1; display: flex; flex-direction: column; background-color: #313338; position: relative; }
        #chat-header { height: 48px; padding: 0 16px; display: flex; align-items: center; font-weight: bold; border-bottom: 1px solid #1f2023; color: #fff; gap: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        #chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; user-select: text; -webkit-user-select: text; }
        .message-row { display: flex; gap: 16px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #4e5058; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; flex-shrink: 0; font-size: 14px; }
        .message-content { display: flex; flex-direction: column; gap: 4px; }
        .msg-meta { display: flex; gap: 8px; align-items: baseline; }
        .msg-user { font-weight: 600; color: #f2f3f5; font-size: 15px; }
        .msg-time { font-size: 11px; color: #949ba4; }
        .msg-body { font-size: 15px; color: #dbdee1; line-height: 1.375; white-space: pre-wrap; word-break: break-word; }
        #input-box-wrapper { padding: 0 16px 24px 16px; background-color: #313338; }
        #input-form { background-color: #383a40; border-radius: 8px; display: flex; padding: 10px 16px; gap: 12px; align-items: center; }
        #message-input { flex: 1; background: transparent; border: none; outline: none; color: #dbdee1; font-size: 15px; user-select: text; -webkit-user-select: text; }
        #send-action-btn { background-color: #5865f2; color: #fff; border: none; padding: 6px 16px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 14px; }
        #login-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: #1e1f22; z-index: 99999; display: flex; align-items: center; justify-content: center; }
        .login-card { background-color: #313338; padding: 32px; border-radius: 8px; width: 90%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 20px; }
        .login-card h2 { text-align: center; color: #fff; font-size: 24px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 12px; font-weight: 700; color: #b5bac1; text-transform: uppercase; }
        .login-field { background-color: #1e1f22; border: 1px solid #111214; padding: 10px; border-radius: 4px; color: #dbdee1; font-size: 15px; outline: none; }
        .login-btn { background-color: #5865f2; color: white; border: none; padding: 12px; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div id="login-overlay">
        <div class="login-card">
            <h2>Welcome Back!</h2>
            <div class="input-group">
                <label>Callsign Username Handle</label>
                <input type="text" id="user-handle" value="Commander" class="login-field">
            </div>
            <div class="input-group">
                <label>Private Server Password Key</label>
                <input type="text" id="server-room-key" placeholder="Type a shared code word..." class="login-field">
            </div>
            <button class="login-btn" onclick="initializeCommsNetwork(event)" ontouchstart="initializeCommsNetwork(event)">Join Secure Server</button>
        </div>
    </div>

    <div id="server-sidebar">
        <div class="server-icon" style="border-radius:30%; background-color:#5865f2; color:#fff;">⚛️</div>
    </div>

    <div id="channels-sidebar">
        <div class="server-header" id="server-name-label">Frontier Hub</div>
        <div class="channels-list">
            <div class="channel-item active" id="chan-general" onclick="switchActiveChannel('general')"><span class="channel-hash">#</span>general</div>
            <div class="channel-item" style="color: #23a55a; font-weight: bold;" onclick="startLiveWebcamCall()"><span class="channel-hash">🎥</span> Join Video Call</div>
        </div>
    </div>

    <div id="main-chat-area">
        <div id="chat-header">
            <span class="channel-hash" style="font-size:24px;">#</span>
            <span id="active-header-title">general</span>
        </div>
        <div id="chat-messages"></div>
        <div id="input-box-wrapper">
            <div id="input-form">
                <input type="text" id="message-input" placeholder="Message #general..." onkeypress="interceptInputKey(event)">
                <button id="send-action-btn" onclick="broadcastChannelPayload(event)" ontouchstart="broadcastChannelPayload(event)">Send</button>
            </div>
        </div>
    </div>
</body>
<script>
    let sPaneNode = null;
    let sChannelLink = null;
    let myHandle = "Commander";
    let roomCode = "global";
    let activeChannel = "general";
    
    // Dedicated corporate pipeline keys utilizing standard secure port 443
    const S_URL = "https://supabase.co";
    const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6aWN4b3d4c2hvdnFxb2ZzaHVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDQwOTYwMDAsImV4cCI6MjA1OTY1MjAwMH0.1vT3X9K07Z8Y-X_9w123456789abcdefghijklmnopqrstuvwxyz";

    function initializeCommsNetwork(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        myHandle = document.getElementById('user-handle').value.trim() || "Commander";
        roomCode = document.getElementById('server-room-key').value.trim() || "global";
        
        const cleanRoom = roomCode.toLowerCase().replace(/[^a-z0-9]/g, '');
        
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('server-name-label').innerText = roomCode.toUpperCase() + " Server";

        // Initialize standard HTTPS connection database loop
        sPaneNode = supabase.createClient(S_URL, S_KEY);

        // Link a secure WebSockets transmission channel over standard web traffic rules
        sChannelLink = sPaneNode.channel(`room_${cleanRoom}`);

        sChannelLink
            .on('broadcast', { event: 'msg' }, (response) => {
                const packet = response.payload;
                appendMessageMarkup(packet);
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    printSystemNotice("Secure network link established! Port 443 Active. ✅");
                }
            });
    }
</script>
<script>
    function broadcastChannelPayload(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        const field = document.getElementById('message-input');
        const rawText = field.value.trim();
        if (!rawText || !sChannelLink) return;

        const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const messagePacket = { user: myHandle, bodyText: rawText, timestamp: timeString };

        // Broadcast text packet straight through normal HTTPS web routing filters
        sChannelLink.send({
            type: 'broadcast',
            event: 'msg',
            payload: messagePacket
        });

        // Immediately write your own message locally onto your screen box
        appendMessageMarkup(messagePacket);

        field.value = '';
        setTimeout(() => { field.focus(); }, 40);
    }

    function appendMessageMarkup(msgData) {
        const container = document.getElementById('chat-messages');
        const row = document.createElement('div');
        row.className = 'message-row';
        const userFirstLetter = msgData.user.charAt(0).toUpperCase();
        
        row.innerHTML = `
            <div class="avatar">${userFirstLetter}</div>
            <div class="message-content">
                <div class="msg-meta">
                    <span class="msg-user">${msgData.user}</span>
                    <span class="msg-time">${msgData.timestamp}</span>
                    </div>
                <div class="msg-body"></div>
            </div>
        `;
        row.querySelector('.msg-body').appendChild(document.createTextNode(msgData.bodyText));
        container.appendChild(row);
        container.scrollTop = container.scrollHeight;
    }

    function printSystemNotice(txtText) {
        const msg = { user: "🔧 SYSTEM", bodyText: txtText, timestamp: "--:--" };
        appendMessageMarkup(msg);
    }

    function switchActiveChannel(cName) { return; }

    function startLiveWebcamCall() {
        const secureRoomId = btoa(roomCode).replace(/=/g, '').substring(0, 12);
        const externalVideoMeetingUrl = `https://jit.si{secureRoomId}`;
        window.open(externalVideoMeetingUrl, '_blank', 'width=800,height=600');
    }

    function interceptInputKey(e) { if (e.key === 'Enter') broadcastChannelPayload(e); }
</script>
</html>
