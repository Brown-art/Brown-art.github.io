<script>
(function(){var u=["https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js","https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js","https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"],i=0;
function n(){if(window.Peer||i>=u.length)return;var s=document.createElement("script");s.crossOrigin="anonymous";s.src=u[i++];s.onerror=n;document.head.appendChild(s)}n()})();
</script>

<style>
:root{--bg1:#1e1f22;--bg2:#2b2d31;--bg3:#313338;--bg4:#383a40;--tx:#dbdee1;--mut:#949ba4;--acc:#5865f2;--grn:#23a55a;--red:#f23f42;--yel:#f0b232}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:var(--bg1);color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{display:flex;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#servers{width:72px;background:var(--bg1);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;flex:none}
.srv{width:48px;height:48px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;font-size:20px;transition:border-radius .15s,background .15s}
.srv.on,.srv:active{border-radius:16px;background:var(--acc)}
.sep{width:32px;height:2px;background:var(--bg3);border-radius:1px}
#channels{width:240px;background:var(--bg2);display:flex;flex-direction:column;flex:none}
.head{height:48px;padding:0 16px;display:flex;align-items:center;font-weight:700;border-bottom:1px solid var(--bg1);flex:none}
.list{padding:8px;overflow-y:auto;flex:1}
.cat{color:var(--mut);font-size:12px;font-weight:700;padding:14px 8px 4px}
.ch{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:10px 8px;border-radius:6px;background:none;color:var(--mut);font-size:16px;margin-bottom:2px}
.ch.on{background:var(--bg4);color:#fff}
.ch.video{background:var(--grn);color:#fff;font-weight:700;margin-top:10px;justify-content:center}
#me{height:56px;background:#232428;display:flex;align-items:center;gap:10px;padding:0 10px;flex:none}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;position:relative}
.av.sm{width:32px;height:32px;font-size:13px}
.dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--grn);border:3px solid #232428}
#mename{font-weight:600;line-height:1.1}
#status{font-size:12px;color:var(--mut)}
#main{flex:1;display:flex;flex-direction:column;background:var(--bg3);min-width:0}
#msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 0}
.m{display:flex;gap:14px;padding:6px 16px}
.m .n{font-weight:600}.m .t{color:var(--mut);font-size:12px;margin-left:8px;font-weight:400}
.m .b{white-space:pre-wrap;overflow-wrap:anywhere}
.sys{color:var(--mut);font-size:13px;padding:4px 16px 4px 62px;font-style:italic}
.empty{margin:auto;padding:24px;color:var(--mut);text-align:center}
#bar{display:flex;gap:8px;margin:0 16px 16px;padding:6px;background:var(--bg4);border-radius:10px;flex:none}
#inp{flex:1;background:none;border:0;outline:0;color:var(--tx);font-size:16px;padding:8px 10px;min-width:0}
#send{background:var(--acc);color:#fff;border-radius:8px;padding:0 18px;font-weight:600}
#members{width:240px;background:var(--bg2);flex:none;display:flex;flex-direction:column}
.mem{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px}
.mem .av .dot{border-color:var(--bg2)}
#chessWrap{display:none;gap:16px;padding:12px 16px;flex:none;align-items:center;border-bottom:1px solid var(--bg1)}
#board{display:grid;grid-template-columns:repeat(8,1fr);width:min(46vh,360px);aspect-ratio:1;border-radius:6px;overflow:hidden;flex:none;touch-action:manipulation}
.sq{display:grid;place-items:center;position:relative;font-size:min(4.4vh,34px);line-height:1}
.sq.l{background:#eeeed2}.sq.d{background:#769656}
.sq.sel{box-shadow:inset 0 0 0 4px var(--yel)}.sq.last{box-shadow:inset 0 0 0 100px rgba(255,235,0,.3)}
.sq.hint::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.28)}
.pw{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000}.pb{color:#111}
#cstatus{font-weight:600;margin-bottom:10px}
#cnew{background:var(--acc);color:#fff;border-radius:8px;padding:10px 16px;font-weight:600}
#gamesWrap{display:none;flex:1;flex-direction:column;align-items:center;gap:12px;padding:14px;overflow:auto}
#gmenu{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#gmenu button{background:var(--acc);color:#fff;border-radius:8px;padding:10px 16px;font-weight:600}
#gscore{font-weight:600;text-align:center}
#gc{width:min(62vh,92%,420px);aspect-ratio:1;background:var(--bg1);border-radius:8px;touch-action:none}
#memeWrap{display:none;flex:1;flex-direction:column;gap:10px;padding:12px 16px;min-height:0}
#mtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#msearch{flex:1;min-width:140px;background:var(--bg4);border:0;border-radius:8px;padding:10px 12px;color:var(--tx);font-size:16px;outline:0}
#mrand{background:var(--acc);color:#fff;border-radius:8px;padding:10px 14px;font-weight:600}
#mcount{color:var(--mut);font-size:13px}#mnote{color:var(--grn);font-weight:600;font-size:13px}
#mchips{display:flex;gap:6px;overflow-x:auto;flex:none}
.chip{flex:none;background:var(--bg4);color:var(--tx);border-radius:16px;padding:6px 14px}.chip.on{background:var(--acc);color:#fff}
#mgrid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start}
.mc{background:var(--bg2);border-radius:10px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px;justify-content:space-between;min-height:150px;cursor:pointer}
.mc:active{background:var(--bg4)}.me{font-size:44px;line-height:1.1}
.mt{font:900 16px Impact,"Arial Black",sans-serif;color:#fff;text-transform:uppercase;white-space:pre-line;overflow-wrap:anywhere;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
#sndWrap{display:none;flex:1;flex-direction:column;gap:10px;padding:12px 16px;min-height:0}
#stop{display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--mut)}
#stop select{background:var(--bg4);color:var(--tx);border:0;border-radius:8px;padding:8px 10px;font-size:16px}
#sgrid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;align-content:start}
.sb{background:var(--bg2);border-radius:12px;padding:14px 8px;text-align:center;color:var(--tx);font-weight:600}
.sb{position:relative}.cx{position:absolute;top:4px;right:8px;font-style:normal;color:var(--mut)}
#cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;flex:none;max-height:32vh;overflow-y:auto}
.sb:active{background:var(--acc)}.sb span{display:block;font-size:34px;margin-bottom:4px}
@media(max-width:900px){#members{display:none}#channels{width:210px}}
#login{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;z-index:10;padding:16px}
.card{background:var(--bg3);border-radius:12px;padding:28px;width:100%;max-width:420px;box-shadow:0 8px 40px #0008}
.card h1{margin:0 0 4px;font-size:24px;text-align:center}
.card p{margin:0 0 18px;color:var(--mut);text-align:center}
.card label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 6px}
.card input{width:100%;background:var(--bg1);border:0;border-radius:6px;padding:12px;color:var(--tx);font-size:16px;outline:0}
.row{display:flex;gap:10px;margin-top:20px}
.row button{flex:1;padding:13px;border-radius:6px;font-weight:700;color:#fff}
#host{background:var(--acc)}#join{background:var(--grn)}
#err{color:var(--red);min-height:20px;margin-top:12px;font-size:13px;text-align:center}
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <h1>Welcome back!</h1>
    <p>Pick a handle and a shared room key. Both iPads must use the same key.</p>
    <label for="user">USERNAME HANDLE</label>
    <input id="user" maxlength="20" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="e.g. skyfox">

    <div class="row"><button id="host">👑 Host Room</button><button id="join">📡 Join Room</button></div>

</div>

<div id="app">
  <nav id="servers"><button class="srv on" aria-label="Home">💬</button><div class="sep"></div><button class="srv">🎮</button><button class="srv">♟️</button></nav>
  <aside id="channels">
    <div class="head">Signal Room</div>
    <div class="list">
      <div class="cat">TEXT CHANNELS</div>
      <button class="ch on" data-c="general"><span>#</span> general</button>
      <button class="ch" data-c="gaming"><span>#</span> gaming</button>
      <button class="ch" data-c="strategy"><span>#</span> strategy</button>

      <button class="ch" data-c="ai"><span>🤖</span> ai-assistant</button>

      <button class="ch video" id="video">🎥 Join Video Call</button>
    </div>
    <div id="me"><div class="av" id="meav">?<span class="dot"></span></div><div><div id="mename">—</div><div id="status">Offline</div></div></div>
  </aside>
  <main id="main">
    <div class="head" id="title"># general</div>
    <div id="chessWrap"><div id="board"></div><div><div id="cstatus"></div><button id="cnew">New game</button></div></div>
    <div id="gamesWrap"><div id="gmenu"><button data-g="snake">🐍 Snake</button><button data-g="2048">🔢 2048</button><button data-g="flap">🐦 Flap</button></div><div id="gscore"></div><canvas id="gc" width="360" height="360"></canvas></div>
    <div id="memeWrap"><div id="mtop"><input id="msearch" placeholder="Search memes…" autocomplete="off"><button id="mrand">🎲 Random 12</button><span id="mcount"></span><span id="mnote"></span></div><div id="mchips"></div><div id="mgrid"></div></div>
    <div id="sndWrap"><div id="stop"><label><input type="checkbox" id="sall" checked> Play on everyone's device</label><label>Pitch <select id="spitch"><option value="0.6">Low</option><option value="1" selected>Normal</option><option value="1.6">High</option></select></label><button id="sadd" class="chip on">➕ Add your own sound</button><input type="file" id="sfile" accept="audio/*" multiple hidden></div><div id="cgrid"></div><div id="sgrid"></div></div>
    <div id="msgs"></div>
    <div id="bar"><input id="inp" placeholder="Message #general" autocomplete="off" enterkeyhint="send"><button id="send">Send</button></div>
  </main>
  <aside id="members"><div class="head">Online Signals</div><div class="list" id="mlist"></div></aside>
</div>

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
window.addEventListener("error",function(e){
  var el=$("err");if(!el)return;
  el.textContent="Script error: "+(e.message||"unknown")+(e.filename?" ("+e.filename.split("/").pop()+":"+e.lineno+")":"");
});
var S={name:"",key:"",code:"",isHost:false,peer:null,conns:[],hostConn:null,channel:"general",
  msgs:{general:[],gaming:[],strategy:[],chess:[],ai:[]},roster:[]};

/* Touch + click handler. preventDefault on touchstart stops the iPad keyboard
   from losing focus; the click fallback is skipped right after a touch. */
function tap(el,fn){
  var last=0;
  el.addEventListener("touchstart",function(e){e.preventDefault();last=Date.now();fn(e)},{passive:false});
  el.addEventListener("mousedown",function(e){e.preventDefault()});
  el.addEventListener("click",function(e){e.preventDefault();if(Date.now()-last>600)fn(e)});
}

/* Scramble the room key into a valid, non-reversible PeerJS ID */
function fnv(s,seed){var h=seed>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(16).padStart(8,"0")}
function roomId(k){return "dcclone-"+fnv(k,2166136261)+fnv(k+"#salt",374761393)+fnv(k.split("").reverse().join(""),97)}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}

var colors=["#5865f2","#eb459e","#f0b232","#23a55a","#e67e22","#1abc9c","#9b59b6"];
function colorOf(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return colors[h%colors.length]}
function avatar(n,cls){var d=document.createElement("div");d.className="av "+(cls||"sm");d.style.background=colorOf(n);d.textContent=(n[0]||"?").toUpperCase();var dot=document.createElement("span");dot.className="dot";d.appendChild(dot);return d}
function clean(s,max){return String(s==null?"":s).slice(0,max)}

/* ---------- Rendering (textContent only: no raw HTML ever) ---------- */
function render(){
  var box=$("msgs");box.textContent="";
  var list=S.msgs[S.channel]||[];
  if(!list.length){var e=document.createElement("div");e.className="empty";e.textContent="This is the start of #"+S.channel+". Say hello!";box.appendChild(e)}
  list.forEach(function(m){
    if(m.sys){var s=document.createElement("div");s.className="sys";s.textContent=m.text;box.appendChild(s);return}
    var row=document.createElement("div");row.className="m";
    var av=avatar(m.user,"");av.style.width=av.style.height="40px";row.appendChild(av);
    var c=document.createElement("div");
    var h=document.createElement("div");
    var n=document.createElement("span");n.className="n";n.style.color=colorOf(m.user);n.textContent=m.user;
    var t=document.createElement("span");t.className="t";t.textContent=new Date(m.ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
    h.appendChild(n);h.appendChild(t);
    var b=document.createElement("div");b.className="b";b.textContent=m.text;
    c.appendChild(h);c.appendChild(b);row.appendChild(c);box.appendChild(row);
  });
  box.scrollTop=box.scrollHeight;
}
function renderRoster(){
  var l=$("mlist");l.textContent="";
  S.roster.forEach(function(n){var r=document.createElement("div");r.className="mem";r.appendChild(avatar(n));var s=document.createElement("span");s.textContent=n+(n===S.name?" (you)":"");r.appendChild(s);l.appendChild(r)});
}
function addMsg(ch,m){if(!S.msgs[ch])return;S.msgs[ch].push(m);if(ch===S.channel)render()}
function sysAll(text){["general","gaming","strategy"].forEach(function(c){addMsg(c,{sys:1,text:text})})}
function setStatus(t){$("status").textContent=t}

/* ---------- Networking ---------- */
function broadcast(data,except){S.conns.forEach(function(c){if(c!==except&&c.open)c.send(data)})}
function sendRoster(){var d={t:"roster",list:S.roster};broadcast(d);renderRoster()}

function onData(conn,d){
  if(!d||typeof d!=="object")return;
  if(d.t==="chess"){chessRecv(d);return}
  if(d.t==="clip"){
    var n2=Date.now();if(n2-lastSnd<300)return;lastSnd=n2;
    var mt=String(d.mime||"").slice(0,40);
    if(d.buf&&d.buf.byteLength<=1500000&&/^audio\//.test(mt)){
      playBuf(d.buf);
      if(S.isHost)broadcast({t:"clip",mime:mt,buf:d.buf},conn);
    }
    return;
  }
  if(d.t==="snd"){
    var nw=Date.now();if(nw-lastSnd<120)return;lastSnd=nw;
    var pp=Math.min(2,Math.max(.4,Number(d.p)||1));
    playSnd(clean(d.id,10),pp);
    if(S.isHost)broadcast({t:"snd",id:clean(d.id,10),p:pp},conn);
    return;
  }
  if(d.t==="hello"&&S.isHost){
    conn.peerName=clean(d.name,20)||"guest";
    if(S.roster.indexOf(conn.peerName)<0)S.roster.push(conn.peerName);
    sysAll(conn.peerName+" joined the room");
    broadcast({t:"sys",text:conn.peerName+" joined the room"},conn);
    sendRoster();
  }else if(d.t==="msg"){
    var ch=(S.msgs[d.ch]&&d.ch!=="ai")?d.ch:"general";
    var m={user:clean(d.user,20),text:clean(d.text,2000),ts:Number(d.ts)||Date.now()};
    addMsg(ch,m);
    if(S.isHost)broadcast({t:"msg",ch:ch,user:m.user,text:m.text,ts:m.ts},conn);
  }else if(d.t==="roster"&&!S.isHost){
    S.roster=(d.list||[]).slice(0,50).map(function(n){return clean(n,20)});renderRoster();
  }else if(d.t==="sys"&&!S.isHost){sysAll(clean(d.text,100))}
}
function wire(conn){
  conn.on("data",function(d){onData(conn,d)});
  conn.on("close",function(){
    S.conns=S.conns.filter(function(c){return c!==conn});
    if(S.isHost&&conn.peerName){
      S.roster=S.roster.filter(function(n){return n!==conn.peerName});
      sysAll(conn.peerName+" left the room");sendRoster();
    }else if(!S.isHost){setStatus("Host disconnected");sysAll("Connection to host lost.")}
  });
}
function fail(msg){$("err").textContent=msg;setStatus("Offline");if(S.peer){try{S.peer.destroy()}catch(e){}S.peer=null}lock(false)}
function lock(b){$("host").disabled=$("join").disabled=b}

function start(host){
  var name=clean($("user").value.trim(),20),key=$("key").value;
  if(!name){$("err").textContent="Enter a username handle.";return}
  if(key.length<4){$("err").textContent="Room key must be at least 4 characters.";return}
  if(typeof Peer==="undefined"){$("err").textContent="PeerJS failed to load. Check your connection.";return}
  $("err").textContent="";lock(true);
  S.name=name;S.key=key;S.isHost=host;S.code=roomId(key);S.roster=[name];
  setStatus(host?"Opening room…":"Connecting…");
  /* secure:true + port 443 = signaling over wss, which firewalls allow */
  var opts={host:"0.peerjs.com",path:"/",secure:true,port:443,debug:0,config:{iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:global.stun.twilio.com:3478"}]}};
  if(!window.RTCPeerConnection){fail("This browser or frame blocks WebRTC. Open the file directly in Safari or Chrome, not inside a preview.");return}
  var peer;
  try{peer=host?new Peer(S.code,opts):new Peer(opts)}catch(err){
    var framed=false;try{framed=window.top!==window}catch(x){framed=true}
    fail("PeerJS error: "+(err&&err.message||err)+" [protocol="+location.protocol+", secureContext="+window.isSecureContext+", inFrame="+framed+"]");return}
  S.peer=peer;
  peer.on("error",function(e){
    var t=e&&e.type;
    if(t==="unavailable-id")fail("That room key is already hosted. Join it, or pick another key.");
    else if(t==="peer-unavailable")fail("No host found for that key. Make sure the host opened the room first.");
    else if(t==="network"||t==="server-error"||t==="socket-error")fail("Can't reach the signaling server. Check your Wi-Fi.");
    else fail("Connection error: "+(t||"unknown"));
  });
  peer.on("open",function(){
    if(host){
      peer.on("connection",function(c){S.conns.push(c);wire(c);c.on("open",function(){c.send({t:"roster",list:S.roster});if(G)c.send({t:"chess",k:"sync",fen:G.fen(),last:lastMove})})});
      enter("Hosting room");
    }else{
      var c=peer.connect(S.code,{reliable:true});
      var to=setTimeout(function(){if(!c.open)fail("Timed out reaching the host. Check the room key.")},15000);
      c.on("open",function(){clearTimeout(to);S.hostConn=c;S.conns=[c];wire(c);c.send({t:"hello",name:name});enter("Connected to host")});
    }
  });
}
function enter(label){
  $("login").style.display="none";setStatus(label);
  $("mename").textContent=S.name;
  var a=$("meav");a.style.background=colorOf(S.name);a.firstChild.nodeValue=S.name[0].toUpperCase();
  renderRoster();
  sysAll(S.isHost?"Room opened. Share your room key with the other device.":"You joined the room.");
}

/* ---------- Sending ---------- */
function send(){
  var i=$("inp"),text=i.value.trim();
  if(!text||!S.peer)return;
  if(S.channel==="ai"){i.value="";i.focus();askAI(text);return}
  var m={t:"msg",ch:S.channel,user:S.name,text:text.slice(0,2000),ts:Date.now()};
  addMsg(S.channel,m);
  if(S.isHost)broadcast(m);else if(S.hostConn&&S.hostConn.open)S.hostConn.send(m);
  i.value="";i.focus(); /* keep the iPad keyboard up */
}

/* ---------- Chess (two players: host = white, joiner = black) ---------- */
var G=null,sel=null,legal=[],lastMove=null;
var PG={p:"\u265F",n:"\u265E",b:"\u265D",r:"\u265C",q:"\u265B",k:"\u265A"};
function mySide(){return S.isHost?"w":"b"}
function chessStatus(){
  var t=G.turn(),me=mySide(),x;
  if(G.in_checkmate())x="Checkmate. "+(t===me?"You lose.":"You win!");
  else if(G.in_draw()||G.in_stalemate())x="Draw.";
  else x=(t===me?"Your move":"Opponent's move")+(G.in_check()?" (check)":"")+" \u2014 you are "+(me==="w"?"white":"black");
  $("cstatus").textContent=x;
}
function drawBoard(){
  if(!G)return;
  var bd=$("board");bd.textContent="";
  var flip=mySide()==="b",rows=G.board();
  for(var r=0;r<8;r++)for(var f=0;f<8;f++){
    var rr=flip?7-r:r,ff=flip?7-f:f,p=rows[rr][ff],name="abcdefgh"[ff]+(8-rr);
    var d=document.createElement("div");d.className="sq "+((rr+ff)%2?"d":"l");
    if(sel===name)d.classList.add("sel");
    if(legal.indexOf(name)>=0)d.classList.add("hint");
    if(lastMove&&(lastMove[0]===name||lastMove[1]===name))d.classList.add("last");
    if(p){var sp=document.createElement("span");sp.className="p"+p.color;sp.textContent=PG[p.type];d.appendChild(sp)}
    (function(n){tap(d,function(){onSq(n)})})(name);
    bd.appendChild(d);
  }
  chessStatus();
}
function onSq(n){
  if(!G||G.game_over()||G.turn()!==mySide())return;
  if(sel&&legal.indexOf(n)>=0){doMove(sel,n,true);return}
  var p=G.get(n);
  if(p&&p.color===mySide()){sel=n;legal=G.moves({square:n,verbose:true}).map(function(m){return m.to})}
  else{sel=null;legal=[]}
  drawBoard();
}
function doMove(from,to,mine){
  var m=G.move({from:from,to:to,promotion:"q"}); /* pawns auto-promote to queen */
  if(!m)return false;
  sel=null;legal=[];lastMove=[from,to];drawBoard();
  if(mine)broadcast({t:"chess",k:"move",from:from,to:to});
  return true;
}
function chessReset(){G=new Chess();sel=null;legal=[];lastMove=null;drawBoard()}
function chessRecv(d){
  if(!G)return;
  if(d.k==="move"){if(G.turn()!==mySide())doMove(clean(d.from,2),clean(d.to,2),false)}
  else if(d.k==="new"){chessReset()}
  else if(d.k==="sync"&&!S.isHost){
    G.load(clean(d.fen,100));
    lastMove=Array.isArray(d.last)?[clean(d.last[0],2),clean(d.last[1],2)]:null;drawBoard();
  }
}

/* ---------- Mini games (swipe, tap, or arrow keys) ---------- */
var GM={stop:null};
function swipes(c,cb){
  var sx=0,sy=0;
  c.ontouchstart=function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;e.preventDefault()};
  c.ontouchend=function(e){var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;e.preventDefault();
    if(Math.max(Math.abs(dx),Math.abs(dy))<20)cb("tap");else cb(Math.abs(dx)>Math.abs(dy)?(dx>0?"R":"L"):(dy>0?"D":"U"))};
  c.onclick=function(){cb("tap")};
  function kd(e){var m={ArrowLeft:"L",ArrowRight:"R",ArrowUp:"U",ArrowDown:"D"," ":"tap"}[e.key];if(m){e.preventDefault();cb(m)}}
  document.addEventListener("keydown",kd);
  return function(){c.ontouchstart=c.ontouchend=c.onclick=null;document.removeEventListener("keydown",kd)};
}
function gstart(g){
  if(GM.stop)GM.stop();
  var c=$("gc"),x=c.getContext("2d"),sc=$("gscore");
  ({snake:snake,"2048":g2048,flap:flap})[g](c,x,sc);
}
function snake(c,x,sc){
  var N=18,Z=20,s,d,nd,f,pts,over,t;
  var dirs={L:{x:-1,y:0},R:{x:1,y:0},U:{x:0,y:-1},D:{x:0,y:1}};
  function hit(p,q){return p.x===q.x&&p.y===q.y}
  function rf(){do{f={x:Math.random()*N|0,y:Math.random()*N|0}}while(s.some(function(p){return hit(p,f)}))}
  function init(){s=[{x:9,y:9},{x:8,y:9}];d=nd=dirs.R;pts=0;over=false;rf();sc.textContent="Swipe to steer. Score 0"}
  function draw(){
    x.fillStyle="#1e1f22";x.fillRect(0,0,360,360);
    x.fillStyle="#f23f42";x.fillRect(f.x*Z+2,f.y*Z+2,Z-4,Z-4);
    s.forEach(function(p,i){x.fillStyle=i?"#23a55a":"#57f287";x.fillRect(p.x*Z+1,p.y*Z+1,Z-2,Z-2)});
  }
  function step(){
    if(over)return;
    d=nd;var h={x:s[0].x+d.x,y:s[0].y+d.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||s.some(function(p){return hit(p,h)})){over=true;sc.textContent="Game over. Score "+pts+". Tap to restart";return}
    s.unshift(h);
    if(hit(h,f)){pts++;sc.textContent="Score "+pts;rf()}else s.pop();
    draw();
  }
  var off=swipes(c,function(k){
    if(over){if(k==="tap")init();return}
    var n=dirs[k];if(n&&!(n.x===-d.x&&n.y===-d.y))nd=n;
  });
  init();draw();t=setInterval(step,120);
  GM.stop=function(){clearInterval(t);off()};
}
function g2048(c,x,sc){
  var g,pts,over;
  var col={0:"#383a40",2:"#eee4da",4:"#ede0c8",8:"#f2b179",16:"#f59563",32:"#f67c5f",64:"#f65e3b",128:"#edcf72",256:"#edcc61",512:"#edc850",1024:"#edc53f",2048:"#edc22e"};
  function add(){var e=[];g.forEach(function(v,i){if(!v)e.push(i)});if(e.length)g[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}
  function line(a){var r=a.filter(Boolean),o=[];for(var i=0;i<r.length;i++){if(r[i]===r[i+1]){o.push(r[i]*2);pts+=r[i]*2;i++}else o.push(r[i])}while(o.length<4)o.push(0);return o}
  function draw(){
    x.fillStyle="#2b2d31";x.fillRect(0,0,360,360);
    g.forEach(function(v,i){
      var cx=(i%4)*90+5,cy=(i/4|0)*90+5;
      x.fillStyle=col[v]||"#3c3a32";x.fillRect(cx,cy,80,80);
      if(v){x.fillStyle=v<8?"#776e65":"#fff";x.font="bold "+(v>999?26:34)+"px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(v,cx+40,cy+42)}
    });
    sc.textContent=over?"No moves left. Score "+pts+". Tap to restart":"Swipe to merge tiles. Score "+pts;
  }
  function init(){g=new Array(16).fill(0);pts=0;over=false;add();add();draw()}
  function move(k){
    var before=g.join();
    for(var i=0;i<4;i++){
      var idx=[0,1,2,3].map(function(j){return k==="L"||k==="R"?i*4+j:j*4+i});
      if(k==="R"||k==="D")idx.reverse();
      var out=line(idx.map(function(q){return g[q]}));
      idx.forEach(function(q,j){g[q]=out[j]});
    }
    if(g.join()!==before)add();
    over=!g.some(function(v,i){return !v||(i%4<3&&v===g[i+1])||(i<12&&v===g[i+4])});
    draw();
  }
  var off=swipes(c,function(k){if(over){if(k==="tap")init();return}if(k!=="tap")move(k)});
  init();GM.stop=off;
}
function flap(c,x,sc){
  var y,v,p,pts,over,run,t;
  function init(){y=180;v=0;p=[{x:360,g:180}];pts=0;over=false;run=false;sc.textContent="Tap to flap through the gaps"}
  function draw(){
    x.fillStyle="#1e1f22";x.fillRect(0,0,360,360);
    x.fillStyle="#23a55a";
    p.forEach(function(o){x.fillRect(o.x,0,44,o.g-55);x.fillRect(o.x,o.g+55,44,360)});
    x.fillStyle="#f0b232";x.beginPath();x.arc(80,y,12,0,7);x.fill();
  }
  function step(){
    if(run&&!over){
      v+=0.45;y+=v;
      p.forEach(function(o){
        o.x-=2.5;
        if(!o.s&&o.x+44<80){o.s=1;pts++;sc.textContent="Score "+pts}
        if(92>o.x&&68<o.x+44&&(y-12<o.g-55||y+12>o.g+55))over=true;
      });
      if(p[0].x<-50)p.shift();
      if(p[p.length-1].x<170)p.push({x:p[p.length-1].x+190,g:90+Math.random()*180});
      if(y>348||y<12)over=true;
      if(over)sc.textContent="Game over. Score "+pts+". Tap to restart";
    }
    draw();
  }
  var off=swipes(c,function(){if(over){init();return}run=true;v=-7});
  init();t=setInterval(step,16);
  GM.stop=function(){clearInterval(t);off()};
}

var AC=null,PM=1,lastSnd=0;
function ac(){
  if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
  if(AC&&AC.state==="suspended")AC.resume();
  return AC;
}

function tn(f,d,ty,t,v,to){
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=ty||"sine";o.frequency.setValueAtTime(f*PM,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to*PM,t+d);
  g.gain.setValueAtTime(v||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
}
function ns(d,t,v,fr,ty,to){
  var n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(var i=0;i<n;i++)a[i]=Math.random()*2-1;
  var src=AC.createBufferSource();src.buffer=b;
  var fl=AC.createBiquadFilter();fl.type=ty||"lowpass";fl.frequency.setValueAtTime(fr||2000,t);
  if(to)fl.frequency.exponentialRampToValueAtTime(to,t+d);
  var g=AC.createGain();g.gain.setValueAtTime(v||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  src.connect(fl);fl.connect(g);g.connect(AC.destination);src.start(t);
}

/* ---------- Your own sounds (files you pick; saved on this iPad) ---------- */
var CS=[],DB=null;
function dbOpen(cb){
  try{
    var r=indexedDB.open("dcsounds",1);
    r.onupgradeneeded=function(){r.result.createObjectStore("s",{keyPath:"id"})};
    r.onsuccess=function(){DB=r.result;cb()};r.onerror=function(){cb()};
  }catch(e){cb()}
}
function dbAll(cb){if(!DB){cb([]);return}try{var q=DB.transaction("s").objectStore("s").getAll();q.onsuccess=function(){cb(q.result||[])};q.onerror=function(){cb([])}}catch(e){cb([])}}
function dbPut(o){if(!DB)return;try{DB.transaction("s","readwrite").objectStore("s").put(o)}catch(e){}}
function dbDel(id){if(!DB)return;try{DB.transaction("s","readwrite").objectStore("s").delete(id)}catch(e){}}
function playBlob(b){var u=URL.createObjectURL(b),a=new Audio(u);a.onended=function(){URL.revokeObjectURL(u)};a.play().catch(function(){})}
function playBuf(buf){
  var a=ac();if(!a)return;
  var ab=buf instanceof ArrayBuffer?buf:buf.buffer.slice(buf.byteOffset,buf.byteOffset+buf.byteLength);
  a.decodeAudioData(ab,function(d){var n=a.createBufferSource();n.buffer=d;n.connect(a.destination);n.start()},function(){});
}
function drawCustom(){
  var g=$("cgrid");g.textContent="";
  CS.forEach(function(c){
    var b=document.createElement("button");b.className="sb";
    var e=document.createElement("span");e.textContent="🎵";b.appendChild(e);b.appendChild(document.createTextNode(c.name));
    var x=document.createElement("em");x.className="cx";x.textContent="✕";
    x.onclick=function(ev){ev.stopPropagation();if(confirm("Delete "+c.name+"?")){dbDel(c.id);CS=CS.filter(function(z){return z!==c});drawCustom()}};
    b.appendChild(x);
    b.onclick=function(){
      playBlob(c.blob);
      if($("sall").checked&&S.peer&&c.blob.size<=1500000)c.blob.arrayBuffer().then(function(buf){broadcast({t:"clip",mime:c.blob.type||"audio/mpeg",buf:buf})});
    };
    g.appendChild(b);
  });
}
$("sadd").onclick=function(){$("sfile").click()};
$("sfile").onchange=function(){
  [].forEach.call(this.files,function(f){
    if(f.size>3000000){alert(f.name+" is over 3 MB. Use a shorter clip.");return}
    var c={id:Date.now()+"-"+Math.random().toString(36).slice(2,7),name:f.name.replace(/\.[^.]+$/,"").slice(0,24),blob:f};
    CS.push(c);dbPut(c);
  });
  this.value="";drawCustom();
};
dbOpen(function(){dbAll(function(a){CS=a;drawCustom()})});
