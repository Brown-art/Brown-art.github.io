<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Stickman Clash Clone</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #111116;
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #game-container {
        position: relative;
        width: 960px;
        height: 600px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border-radius: 8px;
        overflow: hidden;
        border: 2px solid #33333c;
        background-color: #000000;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #1a1a24;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease;
        z-index: 10;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #333;
        border-top: 5px solid #00ffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      #progress-bar {
        width: 200px;
        height: 10px;
        background-color: #333;
        border-radius: 5px;
        margin-top: 20px;
        overflow: hidden;
      }
      #progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #00ffff, #ff007f);
        transition: width 0.2s ease;
      }
      #loading-text {
        margin-top: 12px;
        font-size: 14px;
        letter-spacing: 2px;
        color: #888899;
      }
      #instructions {
        margin-top: 20px;
        text-align: center;
        max-width: 600px;
        color: #aaaaaa;
        font-size: 14px;
        line-height: 1.6;
      }
      .controls-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-top: 15px;
        background-color: #1a1a24;
        padding: 15px 25px;
        border-radius: 6px;
        border: 1px solid #2a2a35;
      }
      .player-panel h3 {
        margin: 0 0 8px 0;
        font-size: 16px;
      }
      .p1-title { color: #00ffff; }
      .p2-title { color: #ff3333; }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>

    <div id="game-container">
      <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="progress-bar">
          <div id="progress-fill"></div>
        </div>
        <div id="loading-text">LOADING ENGINE... <span id="percent">0%</span></div>
      </div>
      <canvas id="unity-canvas"></canvas>
    </div>

    <div id="instructions">
      <h2>Stickman Clash Master Arena</h2>
      <div class="controls-grid">
        <div class="player-panel">
          <h3 class="p1-title">Player 1 (Left)</h3>
          <strong>Move:</strong> A / D Keys<br>
          <strong>Jump:</strong> Spacebar<br>
          <strong>Attack:</strong> Left Click (Fire1)
        </div>
        <div class="player-panel">
          <h3 class="p2-title">Player 2 (Right)</h3>
          <strong>Move:</strong> Left / Right Arrows<br>
          <strong>Jump:</strong> Up Arrow<br>
          <strong>Attack:</strong> Right Control
        </div>
      </div>
    </div>

    <script>
      // Automatically dynamically hooks into whatever names Unity exports
      var container = document.querySelector("#game-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingOverlay = document.querySelector("#loading-overlay");
      var progressFill = document.querySelector("#progress-fill");
      var percentText = document.querySelector("#percent");

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Build.loader.js"; 
      var config = {
        dataUrl: buildUrl + "/Build.data",
        frameworkUrl: buildUrl + "/Build.framework.js",
        codeUrl: buildUrl + "/Build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "StickmanClashClone",
        productVersion: "1.0",
      };

      // Create script tag to dynamically parse loading structures
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var percentage = Math.round(100 * progress);
          progressFill.style.width = percentage + "%";
          percentText.textContent = percentage + "%";
        }).then((unityInstance) => {
          loadingOverlay.style.opacity = "0";
          setTimeout(() => {
            loadingOverlay.style.display = "none";
          }, 500);
        }).catch((message) => {
          // Fallback message showing instructions if local files are missing
          document.querySelector("#loading-text").innerHTML = 
            "<span style='color: #ff3333;'>WebGL Engine Assets Missing!</span><br><br>" +
            "Please make sure your Unity build folder files (Build.data, Build.wasm, etc.)<br>" +
            "are placed correctly inside a folder named <strong>Build</strong> right next to this index.html file.";
          document.querySelector(".spinner").style.display = "none";
          document.querySelector("#progress-bar").style.display = "none";
          console.error(message);
        });
      };
      
      // Safety catch if page is previewed locally before compiling dependencies
      script.onerror = () => {
        document.querySelector("#loading-text").innerHTML = 
          "<span style='color: #ffaa00;'>Waiting for WebGL Compilation Portfolio Assets...</span><br><br>" +
          "Your page structure looks ready! Once you copy your Unity WebGL export folders<br>" +
          "(<strong>Build</strong> and <strong>TemplateData</strong>) into this GitHub repository, your game will load here.";
        document.querySelector(".spinner").style.display = "none";
        document.querySelector("#progress-bar").style.display = "none";
      };
      
      document.body.appendChild(script);
    </script>
  </body>
</html>
