<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Number Guessing Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .game-container {
            background-color: #2a2a35;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            margin-top: 0;
            color: #00adb5;
        }

        .input-group {
            margin: 20px 0;
        }

        input[type="number"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 2px solid #5a5a65;
            background-color: #1e1e24;
            color: white;
            width: 80px;
            text-align: center;
        }

        button {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: 10px;
        }

        button:hover {
            background-color: #008c95;
        }

        .message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: 500;
            min-height: 27px;
        }

        /* Initial overlay screen to capture the browser's required click gesture */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1e1e24;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- The user click on this button satisfies the browser's audio permission rule -->
    <div class="start-overlay" id="startOverlay">
        <h2>Welcome to the Number Challenge</h2>
        <p>Guess the hidden number between 1 and 100.</p>
        <button id="startGameBtn">Start Game</button>
    </div>

    <!-- The actual interactive game interface -->
    <div class="game-container">
        <h1>Guess The Number</h1>
        <p>I am thinking of a number between 1 and 100. Can you guess it?</p>
        
        <div class="input-group">
            <input type="number" id="guessInput" min="1" max="100" placeholder="50">
            <button id="guessBtn">Guess</button>
        </div>

        <div class="message" id="feedbackMsg"></div>
    </div>

    <!-- Audio element with standard looping enabled -->
    <audio id="backgroundAudio" src="https://example.com" loop></audio>

    <script>
        // Game Variables
        let targetNumber;
        let attempts = 0;
        
        // DOM Elements
        const startOverlay = document.getElementById('startOverlay');
        const startGameBtn = document.getElementById('startGameBtn');
        const guessInput = document.getElementById('guessInput');
        const guessBtn = document.getElementById('guessBtn');
        const feedbackMsg = document.getElementById('feedbackMsg');
        const audio = document.getElementById('backgroundAudio');

        // Initialization function to pick a number
        function initGame() {
            targetNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            feedbackMsg.textContent = "";
            feedbackMsg.style.color = "#fff";
            guessInput.value = "";
        }

        // Handle the initial entry click
        startGameBtn.addEventListener('click', () => {
            // Remove the overlay to show the game
            startOverlay.style.display = 'none';
            initGame();

            // Start the looping sound effect seamlessly
            audio.play().catch(err => {
                console.log("Audio playback was intercepted by the browser:", err);
            });
        });

        // Core game logic for checking the guess
        guessBtn.addEventListener('click', () => {
            const userGuess = parseInt(guessInput.value);

            if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
                feedbackMsg.textContent = "Please enter a valid number between 1 and 100.";
                feedbackMsg.style.color = "#d9534f";
                return;
            }

            attempts++;

            if (userGuess === targetNumber) {
                feedbackMsg.textContent = `Correct! You found it in ${attempts} attempts!`;
                feedbackMsg.style.color = "#5cb85c";
            } else if (userGuess < targetNumber) {
                feedbackMsg.textContent = "Too low! Try a higher number.";
                feedbackMsg.style.color = "#f0ad4e";
            } else {
                feedbackMsg.textContent = "Too high! Try a lower number.";
                feedbackMsg.style.color = "#f0ad4e";
            }
        });

        // Allow pressing 'Enter' in the input box to submit a guess
        guessInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                guessBtn.click();
            }
        });
    </script>

</body>
</html>
