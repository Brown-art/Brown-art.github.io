<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomic Sandbox & Live Multi-Chat</title>
    <script src="https://cloudflare.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body { background-color: #0d0d11; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #050508; padding: 12px; text-align: center; border-bottom: 3px solid #3b82f6; }
        header h1 { font-size: 24px; color: #3b82f6; }
        header p { font-size: 12px; color: #aaa; }
        #main-split { flex: 1; display: flex; width: 100vw; height: calc(100vh - 60px); overflow: hidden; }
        #game-side { flex: 3; display: flex; flex-direction: column; padding: 15px; gap: 12px; overflow-y: auto; }
        #chat-side { flex: 1; min-width: 300px; max-width: 400px; background: #161622; border-left: 2px solid #232334; display: flex; flex-direction: column; padding: 15px; }
        .hud { background: #161622; padding: 12px; border-radius: 10px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; border: 1px solid #27273a; }
        .stat { text-align: center; }
        .stat-label { font-size: 11px; color: #888; text-transform: uppercase; font-weight: bold; }
        .stat-val { font-size: 20px; font-weight: bold; }
        .color-blue { color: #3b82f6; }
        .color-yellow { color: #eab308; }
        .color-purple { color: #a855f7; }
        .blueprints-box { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .btn { background: #1e1e2f; border: 1px solid #3d3d52; color: #fff; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 135px; }
        .btn.active { background: #3b82f6; border-color: #60a5fa; }
        .btn span { font-size: 10px; color: #bbb; }
        #status-bar { text-align: center; font-size: 13px; color: #3b82f6; background: rgba(59,130,246,0.1); padding: 8px; border-radius: 6px; border: 1px solid rgba(59,130,246,0.2); }
        .map-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 350px; }
        .map-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(5, 1fr); gap: 6px; width: 100%; height: 100%; max-height: 450px; background: #111118; padding: 10px; border-radius: 12px; border: 2px solid #222230; }
        .cell { background: #1c1c28; border: 1px solid #2d2d42; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; position: relative; }
        .cell-info { font-size: 9px; color: #cbd5e1; margin-top: 3px; background: rgba(0,0,0,0.7); padding: 1px 4px; border-radius: 3px; font-weight: bold; }
        .reactor-danger { background: rgba(239,68,68,0.25) !important; border-color: #ef4444 !important; }
        #chat-header { font-size: 16px; font-weight: bold; padding-bottom: 10px; border-bottom: 1px solid #2d2d42; color: #3b82f6; display: flex; justify-content: space-between; }
        #network-status { font-size: 10px; padding: 2px 6px; border-radius: 10px; background: #dc2626; }
        #chat-messages { flex: 1; overflow-y: auto; margin: 15px 0; display: flex; flex-direction: column; gap: 8px; user-select: text; }
        .msg-bubble { background: #232334; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
        .msg-user { font-weight: bold; color: #60a5fa; font-size: 11px; }
        #chat-input-area { display: flex; gap: 6px; }
        #chat-input { flex: 1; background: #0f0f13; border: 1px solid #3d3d52; border-radius: 6px; padding: 10px; color: white; user-select: text; }
        #send-btn { background: #3b82f6; border: none; padding: 0 15px; border-radius: 6px; color: white; font-weight: bold; }
        #username-prompt { display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; height: 100%; text-align: center; }
    </style>
</head>
<body>
    <header>
        <h1>📡 Serverless Core Sandbox &amp; Live Chat Network</h1>
        <p>Build your colony, maintain grid stability, and send live radio signals!</p>
    </header>
    <div id="main-split">
        <div id="game-side">
            <div class="hud">
                <div class="stat"><div class="stat-label">Citizens</div><div class="stat-val color-blue" id="stat-pop">12</div></div>
                <div class="stat"><div class="stat-label">Treasury</div><div class="stat-val" id="stat-cash">$250</div></div>
                <div class="stat"><div class="stat-label">Science</div><div class="stat-val color-yellow" id="stat-science">0 XP</div></div>
                <div class="stat"><div class="stat-label">Power</div><div class="stat-val color-blue" id="stat-power">0 MW</div></div>
                <div class="stat"><div class="stat-label">Plots</div><div class="stat-val color-purple" id="stat-plots">0/35</div></div>
            </div>
            <div class="blueprints-box">
                <button class="btn" id="tool-farm" onclick="selectTool('farm')">🌾 Farm <span>$50</span></button>
                <button class="btn" id="tool-house" onclick="selectTool('house')">🏠 Cabin <span>$90</span></button>
                <button class="btn" id="tool-lab" onclick="selectTool('lab')">🧪 Lab <span>$150</span></button>
                <button class="btn" id="tool-reactor" onclick="selectTool('reactor')">⚛️ Reactor <span>$450</span></button>
                <button class="btn" style="background:#eab308;" onclick="run30TimesTest()">🤖 Run 30x Test</button>
                <button class="btn" style="background:#dc2626;" onclick="resetEntireSimulation()">🗑️ Reset</button>
            </div>
            <div id="status-bar">Select a construction blueprint above!</div>
            <div class="map-wrapper"><div class="map-grid" id="sandbox-map"></div></div>
        </div>
        <div id="chat-side">
            <div id="username-prompt">
                <h3>Enter Radio</h3>
                <input type="text" id="username-input" value="Commander" style="background:#0f0f13; border:1px solid #3d3d52; padding:8px; color:white; border-radius:6px; text-align:center;">
                <button class="btn" onclick="connectToChatNetwork()">Connect</button>
            </div>
            <div id="active-chat-box" style="display: none; flex: 1; flex-direction: column; height: 100%;">
                <div id="chat-header"><span>📡 Radio Room</span><span id="network-status">CONNECTED</span></div>
                <div id="chat-messages"></div>
                <div id="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleChatKey(event)">
                    <button id="send-btn" onclick="sendBroadcastMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const columns = 7, rows = 5, mapTotalSize = 35;
        const state = { pop: 12, cash: 250, science: 0, power: 0, activeTool: null, tiles: Array(35).fill(null).map(() => ({ type: 'empty', temp: 0 })) };
        const costs = { farm: 50, house: 90, lab: 150, reactor: 450 };
        const visualIcons = { empty: '🌱', farm: '🌾', house: '🏠', lab: '🧪', reactor: '⚛️', ash: '⚫' };
        let mqttClient = null, myCallsign = "Commander", globalTopicChannel = "sandbox/global/chat/room/v1";

        function drawMapGrid() {
            const container = document.getElementById('sandbox-map');
            container.innerHTML = ''; let bCount = 0;
            state.tiles.forEach((tile, idx) => {
                const cell = document.createElement('div'); cell.className = 'cell';
                cell.innerText = visualIcons[tile.type];
                if (tile.type !== 'empty') bCount++;
                if (tile.type === 'reactor') {
                    if (tile.temp > 75) cell.classList.add('reactor-danger');
                    const lbl = document.createElement('div'); lbl.className = 'cell-info'; lbl.innerText = `${Math.floor(tile.temp)}°C`; cell.appendChild(lbl);
                } else if (tile.type !== 'empty') {
                    const lbl = document.createElement('div'); lbl.className = 'cell-info'; lbl.innerText = tile.type.toUpperCase(); cell.appendChild(lbl);
                }
                cell.onclick = () => processInteractions(idx); container.appendChild(cell);
            });
            document.getElementById('stat-pop').innerText = state.pop;
            document.getElementById('stat-cash').innerText = `$${state.cash}`;
            document.getElementById('stat-science').innerText = `${state.science} XP`;
            document.getElementById('stat-power').innerText = `${state.power} MW`;
            document.getElementById('stat-plots').innerText = `${bCount}/35`;
        }

        function selectTool(blueprint) {
            document.querySelectorAll('.blueprints-box .btn').forEach(b => b.classList.remove('active'));
            if (state.activeTool === blueprint) { state.activeTool = null; } 
            else { state.activeTool = blueprint; document.getElementById(`tool-${blueprint}`).classList.add('active'); }
        }

        function processInteractions(idx) {
            const tile = state.tiles[idx];
            if (tile.type === 'reactor') { tile.temp = Math.max(20, tile.temp - 30); drawMapGrid(); return; }
            if (!state.activeTool) return;
            const tool = state.activeTool;
            if (state.cash < costs[tool] || tile.type !== 'empty') return;
            state.cash -= costs[tool]; state.tiles[idx] = { type: tool, temp: 20 };
            state.activeTool = null; document.querySelectorAll('.blueprints-box .btn').forEach(b => b.classList.remove('active'));
            drawMapGrid();
        }

        function backgroundSimTick() {
            let f = 0, h = 0, l = 0, p = 0;
            state.tiles.forEach((tile, index) => {
                if (tile.type === 'farm') f++; if (tile.type === 'house') h++; if (tile.type === 'lab') l++;
                if (tile.type === 'reactor') { tile.temp += 5 + (l * 0.4); p += 250; if (tile.temp >= 100) state.tiles[index] = { type: 'ash', temp: 0 }; }
            });
            state.power = p; state.science += l * 3;
            if (state.pop < (12 + h * 15) && f > 0) state.pop += 2;
            state.cash += (state.pop * 2) + (f * 25) + (state.power * 0.1);
            drawMapGrid();
        }

        function resetEntireSimulation() {
            state.tiles = Array(35).fill(null).map(() => ({ type: 'empty', temp: 0 }));
            state.pop = 12; state.cash = 250; state.science = 0; drawMapGrid();
        }

        function connectToChatNetwork() {
            myCallsign = document.getElementById('username-input').value.trim() || "Commander";
            document.getElementById('username-prompt').style.display = 'none';
            document.getElementById('active-chat-box').style.display = 'flex';
            mqttClient = mqtt.connect("wss://://hivemq.com");
            mqttClient.on('connect', () => { 
                document.getElementById('network-status').innerText = "ONLINE";
                document.getElementById('network-status').style.backgroundColor = "#22c55e";
                mqttClient.subscribe(globalTopicChannel); 
            });
            mqttClient.on('message', (topic, payload) => {
                const data = JSON.parse(payload.toString());
                displayIncomingMessage(data.sender, data.textMessage);
            });
        }

        function sendBroadcastMessage() {
            const input = document.getElementById('chat-input');
            if (!input.value.trim() || !mqttClient) return;
            mqttClient.publish(globalTopicChannel, JSON.stringify({ sender: myCallsign, textMessage: input.value.trim() }));
            input.value = '';
        }

        function displayIncomingMessage(sender, text) {
            const box = document.getElementById('chat-messages');
            const bubble = document.createElement('div'); bubble.className = 'msg-bubble';
            bubble.innerHTML = `<div class="msg-user">${sender}</div>${text}`;
            box.appendChild(bubble); box.scrollTop = box.scrollHeight;
        }

        function handleChatKey(e) { if (e.key === 'Enter') sendBroadcastMessage(); }

        function run30TimesTest() {
            if (!mqttClient) return alert("Connect first!");
            let count = 1;
            const timer = setInterval(() => {
                mqttClient.publish(globalTopicChannel, JSON.stringify({ sender: "🤖 Test_Bot", textMessage: `[Packet ${count}/30] System Connection Validated! ✅` }));
                if (++count > 30) clearInterval(timer);
            }, 150);
        }

        window.onload = () => { drawMapGrid(); setInterval(backgroundSimTick, 1000); };
    </script>
</body>
</html>
